<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="大石至兴文高铁站专线，随手记预约，清楚看收入。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="兴文高铁站专线">
  <link rel="manifest" href="./manifest.webmanifest?v=1.3.1">
  <link rel="icon" href="./icons/icon-192.png?v=1.3.1" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=1.3.1">
  <link rel="stylesheet" href="./styles.css?v=1.3.1">
  <title>兴文高铁站专线 · 司机台账</title>
</head>
<body>
  <div id="page-scroll" class="page-scroll">
  <header class="app-header">
    <a class="brand" href="./" aria-label="兴文高铁站专线首页"><img src="./icons/icon-192.png?v=1.3.1" width="36" height="36" alt=""><span>兴文高铁站专线<small>司机台账</small></span></a>
    <span class="local-badge" id="connection-status"><i></i> 本机保存</span>
  </header>
  <aside id="update-banner" class="update-banner" role="status" hidden><div><strong>发现新版本 <span data-update-version></span></strong><p>更新后即可使用最新功能，已保存的台账会保留。</p></div><div class="update-actions"><button type="button" class="button secondary" data-update-later>稍后</button><button type="button" class="button primary" data-update-now>立即更新</button></div></aside>
  <main id="app" class="app-main"></main>
  </div>
  <nav class="bottom-nav" aria-label="主导航">
    <button data-page="bookings" class="active"><span data-icon="notebook"></span>预约台账</button>
    <button data-page="income"><span data-icon="chart"></span>收入统计</button>
    <button data-page="settings"><span data-icon="settings"></span>设置</button>
  </nav>
  <dialog id="booking-dialog" class="sheet booking-sheet" aria-labelledby="form-title">
    <form id="booking-form" class="sheet-form">
      <div class="sheet-heading"><h2 id="form-title" tabindex="-1" autofocus>新增预约</h2><button type="button" class="text-button keyboard-done" id="keyboard-done" hidden>收起键盘</button><button type="button" class="icon-button close-button" data-close="booking-dialog" aria-label="关闭">×</button></div>
      <div class="sheet-body">
      <input type="hidden" name="id">
      <div class="form-grid date-grid">
        <label>乘车日期<span class="date-picker form-date"><span class="date-display" aria-hidden="true"></span><input name="date" type="date" required min="2020-01-01" max="2100-12-31"></span></label>
        <label>发车班次<select name="hour" required></select></label>
      </div>
      <label id="direction-field" hidden>行车方向<select name="direction"><option value="outbound">大石 → 兴文高铁站</option><option value="return">兴文高铁站 → 大石</option></select></label>
      <fieldset><legend>上车地点</legend><div class="stop-options"><label><input type="radio" name="stop" value="大石"><span>大石</span></label><label><input type="radio" name="stop" value="马岭" checked><span>马岭</span></label><label><input type="radio" name="stop" value="江门"><span>江门</span></label><label class="return-stop" hidden><input type="radio" name="stop" value="兴文高铁站"><span>高铁站</span></label></div></fieldset>
      <label>具体上车点<input name="pickup" maxlength="100" placeholder="例如：马岭农贸市场门口" required autocomplete="off"></label>
      <div class="form-grid phone-grid"><label>联系电话<input name="phone" type="tel" inputmode="tel" maxlength="25" placeholder="方便出发前联系" required autocomplete="off"></label><label><span>乘客称呼 <span class="optional">选填</span></span><input name="name" maxlength="30" placeholder="例如：王先生" autocomplete="off"></label></div>
      <div class="form-grid"><label>乘车人数<input name="passengers" type="number" inputmode="numeric" min="1" max="99" value="1" required></label><label>每人票价（元）<input name="fare" type="number" inputmode="decimal" min="0" max="99999" step="0.01" placeholder="待确认可填 0" required></label></div>
      <div class="form-total"><span>本单合计</span><strong id="form-total">¥0.00</strong></div>
      <div class="form-grid"><label>乘车状态<select name="status"><option value="booked">待上车</option><option value="boarded">已上车</option><option value="cancelled">已取消</option></select></label><label>收款状态<select name="paid"><option value="no">尚未收款</option><option value="yes">已全额收款</option></select></label></div>
      <label><span>备注 <span class="optional">选填</span></span><textarea autocomplete="off" enterkeyhint="done" name="note" rows="2" maxlength="300" placeholder="行李、接人提示等"></textarea></label>
      </div>
      <div class="booking-footer"><p class="form-error" id="booking-error" role="alert"></p><div class="footer-actions"><button type="button" class="button danger-light" id="delete-booking" hidden>删除</button><button type="submit" class="button primary grow">保存预约</button></div></div>
    </form>
  </dialog>
  <dialog id="extra-dialog" class="sheet small-sheet"><form id="extra-form"><div class="sheet-heading"><div><h2>补记班次收入</h2></div><button type="button" class="icon-button" data-close="extra-dialog" aria-label="关闭">×</button></div><p class="muted">记录未预约乘客等额外实收，已收款的预约会自动计入，请勿重复记账。</p><label>日期<span class="date-picker form-date"><span class="date-display" aria-hidden="true"></span><input name="date" type="date" required min="2020-01-01" max="2100-12-31"></span></label><label>班次<select name="hour" required></select></label><label id="extra-direction-field" hidden>方向<select name="direction"><option value="outbound">开往高铁站</option><option value="return">返回大石</option></select></label><label>实收金额（元）<input name="amount" type="number" min="0.01" max="999999" step="0.01" inputmode="decimal" required placeholder="0.00"></label><label>收入说明<input name="note" maxlength="100" placeholder="例如：临时上车 2 人" required></label><p class="form-error" id="extra-error" role="alert"></p><button class="button primary full" type="submit">保存收入</button></form></dialog>
  <dialog id="confirm-dialog" class="sheet small-sheet"><div class="sheet-heading"><h2 id="confirm-title">请确认</h2><button class="icon-button" data-close="confirm-dialog" aria-label="关闭">×</button></div><p id="confirm-message"></p><div class="sheet-footer"><button class="button secondary" data-close="confirm-dialog">取消</button><button class="button primary" id="confirm-action">确定</button></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">请启用 JavaScript 以使用预约台账。记录只保存在本机。</p></noscript>
  <script type="module" src="./app.js?v=1.3.1"></script>
</body>
</html>
